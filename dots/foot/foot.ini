shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12.5
letter-spacing=0
dpi-aware=no
pad=24x22 center
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5
blink=yes

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.78
alpha-mode=matching
blur=yes

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
